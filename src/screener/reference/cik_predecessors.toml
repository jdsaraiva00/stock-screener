# Companies whose filing history is split across SEC registrants.
#
# When a company reorganises under a new holding company it gets a new CIK, and
# its earlier filings stay under the old one. Listing the old CIK here makes the
# refresh load both and store them as one history under the current CIK.
#
# List predecessors newest first. From each predecessor only filings made before
# the successor's first periodic report are used, because many predecessors keep
# filing afterwards as subsidiaries.
#
# Add an entry only after confirming both registrants on EDGAR
# (https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=<number>).
# `screener coverage` lists companies whose filed history looks too short.

