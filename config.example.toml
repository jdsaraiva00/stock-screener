# Copy this file to config.toml and fill in the EDGAR contact line.
# config.toml is git-ignored. All paths are relative to this file.

[edgar]
# The SEC requires automated clients to identify themselves with contact details,
# e.g. "Jane Doe jane.doe@example.com". EDGAR refresh refuses to run while this is empty.
user_agent = ""
requests_per_second = 5        # SEC limit is 10; stay well below it

[universe]
name = "sp500"                 # only "sp500" is implemented so far

[history]
price_start = "2000-01-01"

[benchmarks]
# SPY (adjusted) and ^SP500TR include dividends; ^GSPC is the plain price index.
tickers = ["SPY", "^SP500TR", "^GSPC"]

[storage]
data_dir = "data"

[sources]
# Which provider supplies each kind of data. Swap one here after adding a
# provider class in src/screener/providers/ and registering it in providers/__init__.py.
universe = "wikipedia"
prices = "yfinance"
profile = "yfinance"
statements = "yfinance"
fundamentals = "edgar"
factors = "french"

[yahoo]
requests_per_second = 2
price_batch_size = 50

[refresh]
# A key refreshed successfully within this many hours is skipped unless --force.
max_age_hours = { universe = 24, prices = 12, profile = 24, statements = 168, fundamentals = 24, factors = 168 }
